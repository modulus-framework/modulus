<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1021"/>
      <stop offset="1" stop-color="#101736"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(140 40) scale(620)">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1090 600) scale(560)">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="436" y1="88" x2="564" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="rule" x1="440" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowTL)"/>
  <rect width="1200" height="630" fill="url(#glowBR)"/>

  <!-- logo mark -->
  <g transform="translate(436 88)">
    <rect width="128" height="128" rx="28" fill="url(#tile)"/>
    <path d="M30 90V40L64 72L98 40V90" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g fill="#A5F3FC">
      <circle cx="30" cy="90" r="5"/>
      <circle cx="30" cy="40" r="5"/>
      <circle cx="64" cy="72" r="5"/>
      <circle cx="98" cy="40" r="5"/>
      <circle cx="98" cy="90" r="5"/>
    </g>
  </g>

  <text x="600" y="340" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="78" font-weight="700" fill="#FFFFFF">Modulus Framework</text>

  <rect x="440" y="378" width="320" height="4" rx="2" fill="url(#rule)"/>

  <text x="600" y="442" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" fill="#94A3B8">A modular-monolith framework for .NET 10</text>

  <text x="600" y="556" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#64748B">github.com/cobytelabs/modulus</text>
</svg>
