# Dependabot (GitHub-native, free): proposes dependency updates as pull requests. Chosen over Renovate, which is AGPL-3.0 (see AGENTS.md).
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/deploy/observability"
    schedule:
      interval: "weekly"
