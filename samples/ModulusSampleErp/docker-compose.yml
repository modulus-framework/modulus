services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ModulusSample
      POSTGRES_PASSWORD: ModulusSample
      POSTGRES_DB: ModulusSample
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ModulusSample"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO (S3-compatible storage) is not started by default — the sample uses local
  # file storage out of the box. Add a minio service here if you enable
  # Cobytelabs.Modulus.Storage.S3 (see comments in Program.cs).
