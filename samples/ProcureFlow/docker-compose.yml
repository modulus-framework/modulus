services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ProcureFlow
      POSTGRES_PASSWORD: ProcureFlow
      POSTGRES_DB: ProcureFlow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Single shared database: every module DbContext connects to it and keeps
      # its tables in its own Postgres schema (identity, settings, tenants,
      # features, virtual_file_explorer, notifications, media). Each module has
      # its own EF migrations + per-schema __EFMigrationsHistory table, so on a
      # fresh boot postgres creates only the DB and Migrate creates the schemas.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ProcureFlow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO (S3-compatible storage) — required by the Media module, which uploads
  # files to the "procureflow-uploads" bucket (see Storage section in appsettings.json).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console at http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the media bucket and exits. Runs after MinIO is healthy.
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/procureflow-uploads &&
      echo 'Bucket procureflow-uploads ready' &&
      exit 0
      "

  # The ProcureFlow API. Built from src/API/ProcureFlow.Api/Dockerfile
  # (DockerfileContext = the sample root, so it picks up NuGet.config and all
  # module projects). All ConnectionStrings__* override the localhost defaults
  # baked into modules.*.json / appsettings.json for containerized infra.
  api:
    build:
      context: .
      dockerfile: src/API/ProcureFlow.Api/Dockerfile
    restart: unless-stopped
    environment:
      # Development so the OpenIddict dev issuer (http://localhost:5016) and the
      # password-grant / development-certificate overrides from
      # modules.identity.Development.json apply — the sample's token endpoints
      # otherwise reject plain-HTTP requests in Production.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      RUN_MIGRATIONS: "true"
      # Single shared database (per-module Postgres schemas): every connection
      # string targets the same ProcureFlow DB on the postgres service.
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=ProcureFlow;Username=ProcureFlow;Password=ProcureFlow"
      ConnectionStrings__Authorization: "Host=postgres;Port=5432;Database=ProcureFlow_Authorization;Username=ProcureFlow;Password=ProcureFlow"
      ConnectionStrings__Configuration: "Host=postgres;Port=5432;Database=ProcureFlow;Username=ProcureFlow;Password=ProcureFlow"
      ConnectionStrings__Tenants: "Host=postgres;Port=5432;Database=ProcureFlow;Username=ProcureFlow;Password=ProcureFlow"
      ConnectionStrings__Notifications: "Host=postgres;Port=5432;Database=ProcureFlow;Username=ProcureFlow;Password=ProcureFlow"
      ConnectionStrings__Vendors: "Host=postgres;Port=5432;Database=ProcureFlow;Username=ProcureFlow;Password=ProcureFlow"
      ConnectionStrings__OrgStructure: "Host=postgres;Port=5432;Database=ProcureFlow;Username=ProcureFlow;Password=ProcureFlow"
      ConnectionStrings__Budgeting: "Host=postgres;Port=5432;Database=ProcureFlow;Username=ProcureFlow;Password=ProcureFlow"
      ConnectionStrings__Customs: "Host=postgres;Port=5432;Database=ProcureFlow;Username=ProcureFlow;Password=ProcureFlow"
      ConnectionStrings__Procurement: "Host=postgres;Port=5432;Database=ProcureFlow;Username=ProcureFlow;Password=ProcureFlow"
      ConnectionStrings__TradeFinance: "Host=postgres;Port=5432;Database=ProcureFlow;Username=ProcureFlow;Password=ProcureFlow"
      ConnectionStrings__Import: "Host=postgres;Port=5432;Database=ProcureFlow;Username=ProcureFlow;Password=ProcureFlow"
      ConnectionStrings__Inventory: "Host=postgres;Port=5432;Database=ProcureFlow;Username=ProcureFlow;Password=ProcureFlow"
      ConnectionStrings__Costing: "Host=postgres;Port=5432;Database=ProcureFlow;Username=ProcureFlow;Password=ProcureFlow"
      ConnectionStrings__Finance: "Host=postgres;Port=5432;Database=ProcureFlow;Username=ProcureFlow;Password=ProcureFlow"
      ConnectionStrings__VirtualFileExplorer: "Host=postgres;Port=5432;Database=ProcureFlow;Username=ProcureFlow;Password=ProcureFlow"
      ConnectionStrings__Cache: "redis:6379"
      MessageBus__RabbitMq__HostName: rabbitmq
      MessageBus__RabbitMq__Port: 5672
      MessageBus__RabbitMq__UserName: guest
      MessageBus__RabbitMq__Password: guest
      Storage__Endpoint: "http://minio:9000"
      Storage__AccessKey: minioadmin
      Storage__SecretKey: minioadmin
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:8000"
    ports:
      - "5016:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data: