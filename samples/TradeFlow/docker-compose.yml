services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: TradeFlow
      POSTGRES_PASSWORD: TradeFlow
      POSTGRES_DB: TradeFlow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Single shared database: every module DbContext connects to it and keeps
      # its tables in its own Postgres schema (identity, tenants, vendors, import,
      # costing, customs, inventory, ...). Each module has its own EF migrations
      # + per-schema __EFMigrationsHistory table, so on a fresh boot postgres
      # creates only the DB and --migrate creates the schemas.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U TradeFlow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Seq — structured log sink (Serilog WriteTo:Seq in appsettings.json).
  # UI at http://localhost:15341 (host port offset avoids other local stacks)
  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "15341:5341"
    volumes:
      - seq-data:/data

  # MinIO (S3-compatible storage) — required by the Storage section, which
  # uploads to the "TradeFlow-uploads" bucket (see Storage in appsettings.json).
  # Host ports 9100/9101 avoid clashing with other local MinIO instances.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"   # S3 API
      - "9101:9001"   # Web console at http://localhost:9101
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the uploads bucket and exits. Runs after MinIO is healthy.
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/tradeflow-uploads &&
      echo 'Bucket tradeflow-uploads ready' &&
      exit 0
      "

  # The TradeFlow API. Built from src/API/TradeFlow.Api/Dockerfile
  # (DockerfileContext = the sample root, so it picks up NuGet.config and all
  # module projects). All ConnectionStrings__* override the localhost defaults
  # baked into appsettings.json for containerized infra.
  api:
    build:
      context: .
      dockerfile: src/API/TradeFlow.Api/Dockerfile
    restart: unless-stopped
    environment:
      # Development so the OpenIddict dev issuer (http://localhost:5016) and the
      # password-grant / development-certificate overrides apply — the token
      # endpoints otherwise reject plain-HTTP requests in Production.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      RUN_MIGRATIONS: "true"
      # Single shared database (per-module Postgres schemas): every connection
      # string targets the same TradeFlow DB on the postgres service.
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=TradeFlow;Username=TradeFlow;Password=TradeFlow"
      ConnectionStrings__Authorization: "Host=postgres;Port=5432;Database=TradeFlow_Authorization;Username=TradeFlow;Password=TradeFlow"
      ConnectionStrings__Configuration: "Host=postgres;Port=5432;Database=TradeFlow;Username=TradeFlow;Password=TradeFlow"
      ConnectionStrings__Tenants: "Host=postgres;Port=5432;Database=TradeFlow;Username=TradeFlow;Password=TradeFlow"
      ConnectionStrings__Notifications: "Host=postgres;Port=5432;Database=TradeFlow;Username=TradeFlow;Password=TradeFlow"
      ConnectionStrings__Vendors: "Host=postgres;Port=5432;Database=TradeFlow;Username=TradeFlow;Password=TradeFlow"
      ConnectionStrings__Budgeting: "Host=postgres;Port=5432;Database=TradeFlow;Username=TradeFlow;Password=TradeFlow"
      ConnectionStrings__Customs: "Host=postgres;Port=5432;Database=TradeFlow;Username=TradeFlow;Password=TradeFlow"
      ConnectionStrings__Procurement: "Host=postgres;Port=5432;Database=TradeFlow;Username=TradeFlow;Password=TradeFlow"
      ConnectionStrings__TradeFinance: "Host=postgres;Port=5432;Database=TradeFlow;Username=TradeFlow;Password=TradeFlow"
      ConnectionStrings__Import: "Host=postgres;Port=5432;Database=TradeFlow;Username=TradeFlow;Password=TradeFlow"
      ConnectionStrings__Inventory: "Host=postgres;Port=5432;Database=TradeFlow;Username=TradeFlow;Password=TradeFlow"
      ConnectionStrings__Costing: "Host=postgres;Port=5432;Database=TradeFlow;Username=TradeFlow;Password=TradeFlow"
      ConnectionStrings__Finance: "Host=postgres;Port=5432;Database=TradeFlow;Username=TradeFlow;Password=TradeFlow"
      ConnectionStrings__OrgStructure: "Host=postgres;Port=5432;Database=TradeFlow;Username=TradeFlow;Password=TradeFlow"
      ConnectionStrings__VirtualFileExplorer: "Host=postgres;Port=5432;Database=TradeFlow;Username=TradeFlow;Password=TradeFlow"
      ConnectionStrings__WorkflowEngine: "Host=postgres;Port=5432;Database=TradeFlow;Username=TradeFlow;Password=TradeFlow"
      ConnectionStrings__Cache: "redis:6379"
      MessageBus__RabbitMq__HostName: rabbitmq
      MessageBus__RabbitMq__Port: 5672
      MessageBus__RabbitMq__UserName: guest
      MessageBus__RabbitMq__Password: guest
      Storage__Endpoint: "http://minio:9000"
      Storage__AccessKey: minioadmin
      Storage__SecretKey: minioadmin
      # Serilog Seq sink: container-internal hostname instead of localhost.
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:5341"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:8000"
    ports:
      - "5016:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  seq-data:
  minio-data:
