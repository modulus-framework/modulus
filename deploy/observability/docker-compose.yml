# Observability stack for Modulus applications, Apache-2.0 / MIT components only (see AGENTS.md, open-source dependency policy):
# OpenTelemetry Collector in front of Jaeger (traces), Prometheus (metrics) and VictoriaLogs (logs). Development and small installations.
# Start with:
#   docker compose -f deploy/observability/docker-compose.yml up -d
# The applications send OTLP to http://localhost:4317 (gRPC) or http://localhost:4318 (HTTP); see README.md.
# Web UIs: Jaeger http://localhost:16686 (traces), VictoriaLogs http://localhost:9428/select/vmui (logs), Prometheus http://localhost:9090.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/otel-collector.yaml"]
    volumes:
      - ./collector/otel-collector.yaml:/etc/otelcol/otel-collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on: [jaeger, victorialogs, prometheus]

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    command: ["--config=/etc/jaeger/config.yaml"]
    volumes:
      - ./jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    ports:
      - "16686:16686"

  victorialogs:
    image: victoriametrics/victoria-logs:v1.20.0-victorialogs
    command:
      - "-storageDataPath=/vlogs"
      - "-retentionPeriod=15d"
    volumes:
      - victorialogs-data:/vlogs
    ports:
      - "9428:9428"

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

volumes:
  victorialogs-data:
  prometheus-data:
