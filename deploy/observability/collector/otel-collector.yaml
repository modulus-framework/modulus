# OpenTelemetry Collector (Apache-2.0): receives OTLP from the applications and fans out to Jaeger (traces), Prometheus (metrics)
# and VictoriaLogs (logs). Applications send to 4317 (gRPC) or 4318 (HTTP/protobuf); see AddModulusOpenTelemetry (Otlp:Endpoint).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch:
    send_batch_size: 8192
    timeout: 5s

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
  # VictoriaLogs accepts OTLP logs at /insert/opentelemetry/v1/logs; the exporter appends /v1/logs to this base path.
  otlphttp/victorialogs:
    endpoint: http://victorialogs:9428/insert/opentelemetry

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/victorialogs]
