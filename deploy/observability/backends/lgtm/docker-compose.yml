# Backend option: the Grafana stack in one image (Grafana, Loki, Tempo and Prometheus), behind the OpenTelemetry Collector.
# LICENSE: Grafana, Loki and Tempo are AGPL-3.0 (Grafana Labs relicensed them in 2021). This option is outside the framework's
# open-source dependency policy (AGENTS.md). Run it only after the policy is changed to allow it.
# Start with:
#   docker compose -f deploy/observability/backends/lgtm/docker-compose.yml up -d
# Web UI: Grafana at http://localhost:3000 (admin / the development password below). Applications send OTLP to localhost:4317 or 4318.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/otel-collector.yaml"]
    volumes:
      - ./collector.yaml:/etc/otelcol/otel-collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on: [lgtm]

  lgtm:
    image: grafana/otel-lgtm:0.8.1
    # The image's own collector receives OTLP on 4317/4318 inside the network; the collector above forwards to it.
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "modulus-dev-only"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - lgtm-data:/data
    ports:
      - "3000:3000"

volumes:
  lgtm-data:
