# OWASP ZAP baseline rules for the container scan (build/container-scan.sh). Every other rule keeps its default level.
# 10049 Non-Storable Content: intentional. The API sends Cache-Control: no-store on every response, because the responses carry
# tokens and personal data that must never be cached by an intermediary.
10049	IGNORE	(no-store on API responses is intentional: tokens and personal data must not be cached)
